name: Test
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Use node latest
        uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: Install
        run: npm install
      - name: Lint Test
        run: npm run lint-test
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
        arch: [x86, x64]
        exclude:
          - { os: ubuntu-latest, arch: x86 }
          - { os: macos-latest, arch: x86 }
          - { os: windows-latest, arch: x86, node: 24}
          - { os: windows-latest, arch: x86, node: 26}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Node ${{ matrix.node }} ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Test npm pack
        shell: bash
        run: |
          PKG_TGZ="$(npm pack)"
          tar -ztvf "$PKG_TGZ"
          ! tar -ztf "$PKG_TGZ" | grep -q '^package/build/'
          ! tar -ztf "$PKG_TGZ" | grep -q '^package/\.github/'
          TEST_DIR="$(mktemp -d)"
          cd "$TEST_DIR"
          npm init -y
          npm install "$GITHUB_WORKSPACE/$PKG_TGZ"
          node node_modules/microtime/test.js
      - name: Test npm pack with prebuild
        shell: bash
        env:
          PREBUILDS_ONLY: '1'
        run: |
          npm run prebuild
          PKG_TGZ="$(npm pack)"
          tar -ztvf "$PKG_TGZ"
          tar -ztf "$PKG_TGZ" | grep -q '^package/prebuilds/'
          TEST_DIR="$(mktemp -d)"
          cd "$TEST_DIR"
          npm init -y
          npm install --ignore-scripts "$GITHUB_WORKSPACE/$PKG_TGZ"
          node node_modules/microtime/test.js
