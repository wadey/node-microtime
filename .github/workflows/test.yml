name: Test
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Use node latest
        uses: actions/setup-node@v7
        with:
          node-version: latest
      - name: Install
        run: npm install
      - name: Lint Test
        run: npm run lint-test
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
        arch: [x64, arm64]
        include:
          - { os: windows-latest, arch: x86, node: 22 }
          - { os: ubuntu-latest, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: windows-latest, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner || matrix.os }}
    name: ${{ matrix.os }} / Node ${{ matrix.node }} ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Prebuild
        run: npm run prebuild
      - name: Test prebuild
        run: npm run test-prebuild
