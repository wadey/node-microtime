name: CITGM
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  # For testing the PR
  push:
    branches:
      - citgm

permissions:
  contents: read

jobs:
  check-nightly:
    runs-on: ubuntu-latest
    name: Check for newer Node nightly
    outputs:
      27-nightly: ${{ steps.nightly.outputs['27-nightly'] }}
      28-nightly: ${{ steps.nightly.outputs['28-nightly'] }}
    steps:
      - name: Check nodejs.org nightly index
        id: nightly
        run: |
          node -e '
            const fs = require("fs");
            const maxMajor = 28;
            const nightlies = [27, 28];
            const requiredFiles = ["headers", "linux-x64", "linux-arm64", "osx-arm64-tar", "win-x64-7z", "win-arm64-7z"];
            fetch("https://nodejs.org/download/nightly/index.json")
              .then(r => r.json())
              .then(list => {
                const latest = list[0].version;
                const major = parseInt(latest.slice(1), 10);
                console.log("Latest nightly:", latest, "(major:", major + ")");
                if (major > maxMajor) {
                  console.error(`Newer nightly major ${major}-nightly (${latest}) is available! Update citgm.yml matrix.`);
                  process.exit(1);
                }
                for (const m of nightlies) {
                  const match = list.find(item =>
                    item.version.startsWith(`v${m}.`) &&
                    requiredFiles.every(f => item.files.includes(f))
                  );
                  if (!match) {
                    console.error(`No complete nightly found for v${m}`);
                    process.exit(1);
                  }
                  console.log(`Resolved ${m}-nightly -> ${match.version}`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, `${m}-nightly=${match.version}\n`);
                }
              });
          '
  citgm:
    needs: check-nightly
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26, '27-nightly', '28-nightly']
        arch: [x64]
        exclude:
          - { os: macos-latest, arch: x64, node: '27-nightly' }
          - { os: macos-latest, arch: x64, node: '28-nightly' }
        include:
          - { os: windows-latest, arch: x86, node: 22 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Node ${{ matrix.node }} ${{ matrix.arch }}
    steps:
      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.check-nightly.outputs[matrix.node] || matrix.node }}
          architecture: ${{ matrix.arch }}
      - name: Run CITGM
        run: npx --yes citgm microtime
      - name: Test published prebuild from npm
        shell: bash
        env:
          PREBUILDS_ONLY: '1'
        run: |
          cd "$(mktemp -d)"
          npm init -y
          npm install --ignore-scripts microtime
          node -p "require('node-gyp-build').resolve('./node_modules/microtime')"
          node node_modules/microtime/test.js
