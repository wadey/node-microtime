name: CITGM
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  # For testing the PR
  push:
    branches:
      - citgm

permissions:
  contents: read

jobs:
  check-nightly:
    runs-on: ubuntu-latest
    name: Check for newer Node nightly
    steps:
      - name: Check nodejs.org nightly index
        run: |
          node -e '
            const maxMajor = 28;
            fetch("https://nodejs.org/download/nightly/index.json")
              .then(r => r.json())
              .then(list => {
                const latest = list[0].version;
                const major = parseInt(latest.slice(1), 10);
                console.log("Latest nightly:", latest, "(major:", major + ")");
                if (major > maxMajor) {
                  console.error(`Newer nightly major ${major}-nightly (${latest}) is available! Update citgm.yml matrix.`);
                  process.exit(1);
                }
              });
          '
  citgm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26, '27-nightly', '28-nightly']
        arch: [x86, x64]
        exclude:
          - { os: ubuntu-latest, arch: x86 }
          - { os: macos-latest, arch: x86 }
          - { os: windows-latest, arch: x86, node: 24 }
          - { os: windows-latest, arch: x86, node: 26 }
          - { os: windows-latest, arch: x86, node: '27-nightly' }
          - { os: windows-latest, arch: x86, node: '28-nightly' }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / Node ${{ matrix.node }} ${{ matrix.arch }}
    steps:
      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - name: Run CITGM
        run: npx --yes citgm microtime
      - name: Test published prebuild from npm
        shell: bash
        env:
          PREBUILDS_ONLY: '1'
        run: |
          cd "$(mktemp -d)"
          npm init -y
          npm install --ignore-scripts microtime
          node -p "require('node-gyp-build').resolve('./node_modules/microtime')"
          node node_modules/microtime/test.js
